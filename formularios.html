<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formularios</title>
    <link rel="icon" href="./src/perilla.png">
</head>
<body>
    <h1> Formulario de Registro </h1>
    <form action="">

        <div> 
            <p> Title </p>
            <input type="radio" name="title" id="mr"> 
            <label for="mr"> Mr </label>

            <input type="radio" name="title" id="mrs"> 
            <label for="mrs"> Mrs </label>

            <input type="radio" name="title" id="miss"> 
            <label for="miss"> Miss </label>
        </div>
        <div>
            <label for="firstName"> First Name </label>
            <br>
            <input type="text" id="firstName" placeholder="John..."> 
        </div>

        <div>
            <label for="lastName"> Last Name </label>
            <br>
            <input type="text" id="lastName" placeholder="Doe"> 
        </div>

        <div>
            <label for="email"> E-mail </label>
            <br>
            <input type="text" id="email" placeholder="johndoe@youremail.com"> 
        </div>

        <div>
            <label for="phone"> Phone </label>
            <br>
            <input type="number" id="phone" placeholder="5511314324"> 
        </div>

        <div>
            <label for="password"> Password </label>
            <br>
            <input type="password" id="password">
        </div>

        <div>
            <label for="country"> Country </label>
            <select name="country" id="country">
                <option value="mexico"> México </option>
                <option value="colombia"> Colombia </option>
                <option value="estadosUnidos"> Estados Unidos </option>
                <option value="japon"> Japón </option>
                <option value="argentina"> Argentina </option>
                <option value="coreadelSur"> Corea del Sur </option>
                <option value="china"> China </option>
                <option value="italia"> Italia </option>
            </select>
        </div>

        <div>
            <input type="checkbox" id="">
            <label for="terms"> I agree to therms and conditions </label>
        </div>

        <div>
            <label for="message"> Message </label>
            <textarea name="message" id="message" cols="30" rpws="10" placeholder="Write your message"></textarea>
        </div>

        <div>
            <label for="photo"> Your photo </label>
            <br>
            <input type="file" name="photo" id="photo">
        </div>

        <div>
            <button type="submit"> Sign up </button>
            <button> Reset form </button>
        </div>
    </form>
</body>
</html>
